name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            .pio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade pip platformio

      - name: Build firmware
        run: pio run -e m5stack-cardputer-usb-gps

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cardputerusbgps-firmware
          path: .pio/build/m5stack-cardputer-usb-gps/*.bin
